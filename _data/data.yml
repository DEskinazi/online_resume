career-profile:
    title: Summary Statement
    summary: |
      Documentation and knowledge systems leader with 10+ years of experience building scalable content operations, developer documentation programs, and enterprise knowledge infrastructure. Experienced in leading cross-functional initiatives spanning Product, Engineering, UX, Security, IT, and Support to improve content quality, discoverability, and organizational effectiveness. 
      
      Currently focused on AI enablement, governance, and knowledge strategy, including the development of responsible AI adoption frameworks, content standards, and operational processes that support scalable use of Generative AI technologies. Proven track record of building documentation programs, leading teams, driving process improvements, and delivering measurable business outcomes in complex SaaS and AdTech environments.

