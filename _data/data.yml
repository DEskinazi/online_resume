      Technical Writer with more than 10+ years of experience translating complex AdTech, SaaS, and data-platform concepts into clear, user-centered content. Specializes in content design, UX writing, and documentation systems for enterprise and developer-facing products. Proven partner to product, design, and engineering teams, using analytics and user feedback to shape scalable content frameworks and improve product usability.

