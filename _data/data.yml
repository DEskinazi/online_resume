experiences:
    title: Work Experience
    info:

      - role: "Manager, Technical Writing & Documentation"
        time: October 2024 - Present
        company: Samsung Ads, Mountain View, CA
        details: |

            *Leads a technical writing team and designs knowledge governance systems for Samsung Ads' documentation organization.*

            - Design enterprise knowledge governance frameworks and content operating models that standardize ownership, intake, publication readiness, and lifecycle management across documentation systems.
            - Identified organizational process gaps and expanded end-user documentation support from 2 to 8 product solutions over approximately 6-8 months (2025).
            - Partner with Product, Engineering, Design, Security, and IT stakeholders to align documentation processes with product delivery workflows.
            - Design a content governance framework for RAG-based knowledge ingestion across business teams: classification rules, lifecycle standards, and quality gates aligned to company style guide and templates. Framework designed and handed off for team rollout.
            - Redesign documentation operations by embedding governance checkpoints into Jira workflows and product development processes, reducing reliance on manual coordination and increasing documentation participation earlier in the product lifecycle.
            - Reduced stale content by 22% across a 64,000+ page Confluence footprint.
            - Champion adoption of standardized Product Requirements Documents (PRDs) and expand documentation engagement into UX design and microcopy reviews.
            - Define and report on quarterly OKRs for documentation and knowledge governance delivery within a complex, siloed organizational structure.
            - Manage two technical writers through hiring, mentoring, coaching, and performance management.
      
      - role: Senior Technical Writer
        time: September 2019 - June 2024
        company: Treasure Data, Mountain View, CA
        details: |
          
            - Built and scaled the company’s first developer documentation ecosystem supporting governance, API, SDK, and enterprise customer data platform initiatives.
            - Launched a developer documentation portal that reduced engineering support time and time spent reconciling API contracts between frontend and backend teams, saving an estimated $500K annually.
            - Built a Jira Service Desk for documentation support, critical for coordinating a globally distributed support team, cutting content-update turnaround from weeks to under 36 hours.
            - Partnered across Product, Engineering, UX, Support, and Program Management to align product delivery with scalable knowledge systems.
            - Developed governance-supporting content frameworks for security, machine learning, and enterprise workflow systems.
            - Automated the monthly release-notes process, increasing operational efficiency and enabling stakeholders to focus on innovation and high-value work.
            - Partnered with Product Ops and Technical Program Management, enhancing operational workflows, dismantling silos, and fostering a collaborative environment.
      
      - role: Writer & Editor  
        time: January 2014 - Present
        company: Freelancer, Los Gatos, CA 
        details: |
        
            - Delivered primary and secondary competitive intelligence research on pharmaceutical treatments in development, including direct liaison with industry contacts and key opinion leaders, for pharmaceutical clients.
            - Delivered content strategy and marketing materials for a franchise services client.
            - Provided technical documentation, website copywriting, and marketing content for small businesses across a range of industries.
      - role: Magazine and Features Editor  
        time: March 2016 - March 2019
        company: New SV Media, San Jose, CA 
        details: |
        
            - Directed the production and content strategy of two weekly lifestyle magazines and front-page centerpieces for three weekly newspapers. Delivered award-winning material.
            - Managed writers and photographers, providing mentorship and skill enhancement through feedback and professional development.

      - role: Technical Writer (Trainer) 
        time: December 2012 - May 2016
        company: Learning & Employee Development - SCC, San Jose, CA
        details: |
          
            - Led initiatives for new software implementations for a $1 million education fund served by 16,000 employees in 27 user groups.
            - Delivered employee training and managed learning partners.
            - Administered Learning Management System (LMS) platforms (Saba, Skillsoft) for course delivery and training logistics.

