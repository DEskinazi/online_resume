experiences:
    title: Work Experience
    info:

      - role: "Manager, Technical Writing & Documentation"
        time: October 2024 - Present
        company: Samsung Ads, Mountain View, CA
        details: |

            *Leads knowledge governance and content systems supporting Samsung Ads' AI enablement initiatives.*

            - Design enterprise knowledge governance frameworks and scalable content operating models that standardize ownership, intake, publication readiness, lifecycle management, and cross-functional collaboration across enterprise documentation systems.
            - Identify organizational process gaps and architect operational improvements that expand end-user documentation support from 2 to 8 product solutions over approximately 6-8 months.
            - Lead strategic initiatives with Product, Engineering, Design, Security, IT, and business stakeholders to align governance standards, documentation processes, and scalable knowledge management practices across product delivery workflows.
            - Design a content governance framework for RAG-based knowledge ingestion across business teams, defining classification rules (include, archive, merge, update), lifecycle standards, and quality gates aligned to company style guide and functional templates to ensure structured knowledge readiness for AI-enabled systems.
            - Redesign documentation operations by embedding governance checkpoints into Jira workflows and product development processes, reducing reliance on manual coordination and increasing documentation participation earlier in the product lifecycle.
            - Champion adoption of standardized Product Requirements Documents (PRDs) and expand documentation engagement into UX design and microcopy reviews to strengthen launch readiness and cross-functional alignment.
            - Build feedback loops and lightweight analytics practices to identify knowledge gaps, prioritize documentation investments, and improve business-critical content delivery.
            - Lead and develop a technical writing team through hiring, mentoring, coaching, and operational leadership that improves consistency, quality, and delivery effectiveness.      
      
      - role: Senior Technical Writer
        time: September 2019 - June 2024
        company: Treasure Data, Mountain View, CA
        details: |
          
            - Built and scaled the company’s first developer documentation ecosystem supporting AI, machine learning, governance, API, SDK, and enterprise customer data platform initiatives.
            - Reduced operational inefficiencies through automation, service desk innovation, and process redesign, saving significant organizational resources.
            - Partnered across Product, Engineering, UX, Support, and Program Management to align product delivery with scalable knowledge systems.
            - Developed governance-supporting content frameworks for security, machine learning, and enterprise workflow systems.
            - Created onboarding and internal enablement programs that accelerated productivity and organizational scalability.
            - Introduced KPI-driven content operations that improved documentation performance, response times, and user satisfaction.
      
      - role: Writer & Editor  
        time: January 2014 - Present
        company: Freelancer, Los Gatos, CA 
        details: |
        
            - Competitive intelligence, content strategy, and technical documentation for B2B, B2C, and pharmaceutical clients, ensuring alignment with client objectives, timeline, and budget.
      - role: Magazine and Features Editor  
        time: March 2016 - March 2019
        company: New SV Media, San Jose, CA 
        details: |
        
            - Directed the production and content strategy of two weekly lifestyle magazines and front-page centerpieces for three weekly newspapers. Delivered award-winning material.
            - Managed writers and photographers, providing mentorship and skill enhancement through feedback and professional development.

      - role: Technical Writer (Trainer) 
        time: December 2012 - May 2016
        company: Learning & Employee Development - SCC, San Jose, CA
        details: |
          
            - Led initiatives for new software implementations for a $1 million education fund served by 16,000 employees in 27 user groups.
            - Delivered employee training and managed learning partners.

