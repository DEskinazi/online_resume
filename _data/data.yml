experiences:
    title: Work Experience
    info:

      - role: Manager, AI Enablement & Knowledge Systems
        time: October 2024 - Present
        company: Samsung Ads, Mountain View, CA
        details: |
          
            - Lead enterprise knowledge and documentation operations while shaping GenAI adoption strategies, governance standards, and scalable AI productivity frameworks.
            - Partner with executive and cross-functional stakeholders to define, approve, and operationalize commercial and internal GenAI use cases.
            - Designed repeatable frameworks for AI-assisted content creation, workforce enablement, and documentation quality assurance.
            - Built operational systems that improved team efficiency, stakeholder alignment, and organizational maturity across documentation and AI-related workflows.
            - Established analytics-driven feedback loops to identify support gaps, optimize content systems, and improve business-critical knowledge delivery.
            - Serve as strategic contributor to core AI transformation initiatives influencing enterprise-wide standards.
      
      - role: Senior Technical Writer
        time: September 2019 - June 2024
        company: Treasure Data, Mountain View, CA
        details: |
          
            - Built and scaled the company’s first developer documentation ecosystem supporting AI, machine learning, governance, API, SDK, and enterprise customer data platform initiatives.
            - Reduced operational inefficiencies through automation, service desk innovation, and process redesign, saving significant organizational resources.
            - Partnered across Product, Engineering, UX, Support, and Program Management to align product delivery with scalable knowledge systems.
            - Developed governance-supporting content frameworks for security, machine learning, and enterprise workflow systems.
            - Created onboarding and internal enablement programs that accelerated productivity and organizational scalability.
            - Introduced KPI-driven content operations that improved documentation performance, response times, and user satisfaction.
      
      - role: Writer & Editor  
        time: January 2014 - Present
        company: Freelancer, Los Gatos, CA 
        details: |
        
            - Competitive intelligence, content strategy, and technical documentation for B2B, B2C, and pharmaceutical clients, ensuring alignment with client objectives, timeline, and budget.
      - role: Magazine and Features Editor  
        time: March 2016 - March 2019
        company: New SV Media, San Jose, CA 
        details: |
        
            - Directed the production and content strategy of two weekly lifestyle magazines and front-page centerpieces for three weekly newspapers. Delivered award-winning material.
            - Managed writers and photographers, providing mentorship and skill enhancement through feedback and professional development.

      - role: Technical Writer (Trainer) 
        time: December 2012 - May 2016
        company: Learning & Employee Development - SCC, San Jose, CA
        details: |
          
            - Led initiatives for new software implementations for a $1 million education fund served by 16,000 employees in 27 user groups.
            - Delivered employee training and managed learning partners.

