    title: Summary Statement
    summary: |
      Experienced AI transformation and knowledge management leader with 10+ years driving enterprise content systems, cross-functional operations, and scalable governance frameworks across SaaS, AdTech, and machine learning ecosystems. Proven success leading GenAI adoption, operationalizing AI-enabled workflows, designing documentation and knowledge infrastructures, and aligning technical, product, support, and executive stakeholders. Skilled in AI governance, process optimization, enablement strategy, and building systems that improve organizational efficiency, reduce friction, and accelerate product adoption.

