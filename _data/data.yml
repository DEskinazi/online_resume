experiences:
    title: Work Experience
    info:

      - role: Manager, Technical Writing & Documentation
        time: October 2024 - Present
        company: Samsung Ads, Mountain View, CA
        details: |
          
            - Designed scalable content frameworks and writing standards that improved clarity, consistency, and usability of Ads platform documentation across technical and non-technical audiences, including GenAI-assisted content workflows.
            - Partnered with product, engineering, UX, and support teams to design content workflows informed by support tickets and user feedback, improving issue visibility and enabling more targeted content and UX improvements.
            - Applied analytics and usage data to evaluate documentation effectiveness, identify high-impact content gaps, and iteratively improve content structure, taxonomy, and user experience.
            - Designing a generative AI–assisted content framework to improve discoverability, consistency, and accuracy of Ads platform documentation.
            - Building LLM-based content analysis agents that synthesize support tickets, product feedback, and usage data to surface high-impact UX and content design improvements.
            - Designing a Retrieval-Augmented Generation (RAG) content system for internal knowledge bases, including governance, source ownership, and lifecycle standards to support reliable, user-centered knowledge retrieval.
      
      - role: Senior Technical Writer
        time: September 2019 - June 2024
        company: Treasure Data, Mountain View, CA
        details: |
          
            - Designed content models, information architecture, and UX documentation for APIs, SDKs, and data workflows supporting enterprise AdTech and ML use cases.
            - Collaborated with UX, product, and engineering teams to design content and UX documentation across multiple product touchpoints, influencing product decisions from early discovery through launch.
            - Pioneered Treasure Data's first developer documentation portal, accelerating implementation and saving $500k annually by improving alignment time between FE and BE teams.
            - Established Jira Service Desk for Docs, reducing ticket resolution from months or weeks to fewer than 36 hours, setting standards for documentation efficiency.
            - Directed monthly release note process, increasing operational efficiency and enabling stakeholders to focus on innovation and high-value activities.
            - Partnered with Product Ops and Technical Program Management, enhancing operational workflows, dismantling silos, and fostering a collaborative environment.
      
      - role: Writer & Editor  
        time: January 2014 - Present
        company: Freelancer, Los Gatos, CA 
        details: |
        
            - Competitive intelligence, content strategy, and technical documentation for B2B, B2C, and pharmaceutical clients, ensuring alignment with client objectives, timeline, and budget.
      - role: Magazine and Features Editor  
        time: March 2016 - March 2019
        company: New SV Media, San Jose, CA 
        details: |
        
            - Directed the production and content strategy of two weekly lifestyle magazines and front-page centerpieces for three weekly newspapers. Delivered award-winning material.
            - Managed writers and photographers, providing mentorship and skill enhancement through feedback and professional development.

      - role: Technical Writer (Trainer) 
        time: December 2012 - May 2016
        company: Learning & Employee Development - SCC, San Jose, CA
        details: |
          
            - Led initiatives for new software implementations for a $1 million education fund served by 16,000 employees in 27 user groups.
            - Delivered employee training and managed learning partners.

