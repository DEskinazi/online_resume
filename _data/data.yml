career-profile:
    title: Summary Statement
    summary: |
      Knowledge Systems and Content Governance leader with 12+ years of experience designing scalable operating models for enterprise knowledge, content operations, and AI-enabled workflows. I specialize in building governance frameworks, cross-functional processes, and information architectures that improve how organizations create, manage, and trust knowledge.

      My work spans content governance, knowledge management, documentation strategy, and responsible AI adoption across enterprise SaaS and AdTech organizations. I partner with Product, Engineering, Design, Security, and business teams to design systems that improve content quality, operational efficiency, and organizational alignment.

      I focus on identifying operational friction and building scalable systems that move organizations from ad hoc content creation to structured, governed, and AI-augmented knowledge ecosystems.

